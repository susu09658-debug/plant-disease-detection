# ============================================================
# 训练策略：微调 (Fine-Tune)
# 用途：使用更大模型 + AdamW 优化器追求更高检测精度
# ============================================================
# 采用 YOLOv11s 模型（参数量更大、特征提取能力更强），
# 搭配 AdamW 优化器和较低初始学习率实现精细微调。
# 使用余弦退火学习率调度，使学习率平滑衰减。
# 关闭末期 Mosaic 确保最终精度最大化。
# 适用于 FieldPlant 数据集 (27 类: 木薯/玉米/番茄)。
# 论文中可用于展示更高精度的实验结果。
# ============================================================

# ---- 基本训练参数 ----
model: yolo11s.pt            # 使用更大的 YOLOv11s 模型 (9.4M 参数)
epochs: 250                  # 充足训练轮数
batch: 16                    # 批次大小
imgsz: 640                   # 输入图片尺寸
patience: 40                 # 更大的耐心值

# ---- 优化器参数 ----
optimizer: AdamW             # AdamW 优化器（自适应学习率 + 权重衰减解耦）
lr0: 0.001                   # 较低初始学习率（微调常用）
lrf: 0.01                    # 余弦退火：最终学习率 = lr0 * 0.01
cos_lr: true                 # 显式启用余弦退火
momentum: 0.937              # 动量
weight_decay: 0.015          # AdamW 推荐较大权重衰减

# 预热策略
warmup_epochs: 5.0           # 预热 5 轮
warmup_momentum: 0.5         # 预热起始动量
warmup_bias_lr: 0.01         # 预热偏置学习率

# ---- 训练技巧 ----
nbs: 64                      # 名义 batch size
amp: true                    # 混合精度训练

# ---- 数据增强参数（中等） ----
hsv_h: 0.015                 # HSV 色调
hsv_s: 0.7                   # HSV 饱和度
hsv_v: 0.4                   # HSV 亮度
degrees: 5.0                 # 轻度旋转
translate: 0.1               # 平移比例
scale: 0.5                   # 缩放比例
fliplr: 0.5                  # 水平翻转
flipud: 0.0                  # 不垂直翻转
mosaic: 1.0                  # 马赛克增强
close_mosaic: 15             # 最后 15 轮关闭 Mosaic
mixup: 0.1                   # 轻度 MixUp
erasing: 0.1                 # 轻度随机擦除

# ---- 正则化 ----
label_smoothing: 0.05        # 轻度标签平滑

# ---- 输出与保存 ----
project: runs/train
name: finetune
save_period: 10
plots: true
