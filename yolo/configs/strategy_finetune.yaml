# ============================================================
# 训练策略：微调 (Fine-Tune)
# 用途：使用更大模型 + AdamW 优化器追求更高检测精度
# ============================================================
# 采用 YOLOv11s 模型（参数量更大、特征提取能力更强），
# 搭配 AdamW 优化器和较低初始学习率实现精细微调。
# 使用余弦退火学习率调度 (lrf=0.1)，使学习率平滑衰减。
# 论文中可用于展示更高精度的实验结果。
# ============================================================

# ---- 基本训练参数 ----
model: yolo11s.pt            # 使用更大的 YOLOv11s 模型 (9.4M 参数)
epochs: 150                  # 增加训练轮数
batch: 16                    # 批次大小
imgsz: 640                   # 输入图片尺寸
patience: 30                 # 更大的耐心值

# ---- 优化器参数 ----
optimizer: AdamW             # AdamW 优化器（自适应学习率 + 权重衰减解耦）
lr0: 0.001                   # 较低初始学习率（微调常用）
lrf: 0.1                     # 余弦退火：最终学习率 = lr0 * 0.1
momentum: 0.937              # 动量
weight_decay: 0.01           # AdamW 推荐较大权重衰减

# ---- 数据增强参数（中等） ----
hsv_h: 0.015                 # HSV 色调
hsv_s: 0.7                   # HSV 饱和度
hsv_v: 0.4                   # HSV 亮度
degrees: 5.0                 # 轻度旋转
translate: 0.1               # 平移比例
scale: 0.5                   # 缩放比例
fliplr: 0.5                  # 水平翻转
flipud: 0.0                  # 不垂直翻转
mosaic: 1.0                  # 马赛克增强
mixup: 0.05                  # 轻度 MixUp

# ---- 输出与保存 ----
project: runs/train
name: finetune
save_period: 10
plots: true
