# ============================================================
# YOLOv8 训练超参数配置
# Training Hyperparameters Configuration
# ============================================================
# 在论文中可以描述:
#   "本文采用 YOLOv8n 模型进行植物病害检测，训练参数如下表所示..."
# ============================================================

# ---- 基本训练参数 ----
model: yolov8n.pt           # 预训练模型 (n/s/m/l/x 可选)
epochs: 100                  # 训练轮数
batch: 16                    # 批次大小 (根据 GPU 显存调整)
imgsz: 640                   # 输入图片尺寸
patience: 20                 # 早停轮数 (验证集指标不再提升时)

# ---- 优化器参数 ----
optimizer: SGD               # 优化器 (SGD / Adam / AdamW)
lr0: 0.01                    # 初始学习率
lrf: 0.01                    # 最终学习率 (lr0 * lrf)
momentum: 0.937              # SGD 动量
weight_decay: 0.0005         # 权重衰减

# ---- 数据增强参数 ----
hsv_h: 0.015                 # HSV 色调增强
hsv_s: 0.7                   # HSV 饱和度增强
hsv_v: 0.4                   # HSV 亮度增强
degrees: 0.0                 # 旋转角度
translate: 0.1               # 平移比例
scale: 0.5                   # 缩放比例
fliplr: 0.5                  # 水平翻转概率
flipud: 0.0                  # 垂直翻转概率
mosaic: 1.0                  # 马赛克增强概率
mixup: 0.0                   # MixUp 增强概率

# ---- 输出与保存 ----
project: runs/train          # 训练结果保存目录
name: plant_disease          # 实验名称
save_period: 10              # 每 N 轮保存一次权重
plots: true                  # 生成训练过程图表
