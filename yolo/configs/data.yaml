# ============================================================
# 植物病害检测数据集配置文件 (YOLOv11 格式 - FieldPlant)
# Plant Disease Detection Dataset Configuration
# ============================================================
# 数据集来源: Roboflow FieldPlant v11
# https://universe.roboflow.com/plant-disease-detection/fieldplant/dataset/11
# 许可证: CC BY 4.0
#
# 使用说明:
#   1. 将数据集图片放入 datasets/plant_disease/images/{train,val,test}/
#   2. 将对应标注文件放入 datasets/plant_disease/labels/{train,val,test}/
#   3. 标注格式: YOLO TXT (class_id cx cy w h)，坐标归一化到 [0, 1]
#   4. 使用 prepare_dataset.py 可自动完成上述步骤
# ============================================================

# 数据集根目录 (相对于项目根目录)
path: ../datasets/plant_disease

# 子目录
train: images/train
val: images/val
test: images/test

# 类别数 (FieldPlant 数据集包含 27 个类别: 木薯 5 类 + 玉米 16 类 + 番茄 6 类)
nc: 27

# 类别名称 (FieldPlant 数据集类别定义)
names:
  0: Cassava Bacterial Blight
  1: Cassava Brown Leaf Spot
  2: Cassava Healthy
  3: Cassava Mosaic
  4: Cassava Root Rot
  5: Corn Brown Spots
  6: Corn Charcoal
  7: Corn Chlorotic Leaf Spot
  8: Corn Gray leaf spot
  9: Corn Healthy
  10: Corn Insects Damages
  11: Corn Mildew
  12: Corn Purple Discoloration
  13: Corn Smut
  14: Corn Streak
  15: Corn Stripe
  16: Corn Violet Decoloration
  17: Corn Yellow Spots
  18: Corn Yellowing
  19: Corn leaf blight
  20: Corn rust leaf
  21: Tomato Brown Spots
  22: Tomato bacterial wilt
  23: Tomato blight leaf
  24: Tomato healthy
  25: Tomato leaf mosaic virus
  26: Tomato leaf yellow virus

