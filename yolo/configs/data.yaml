# ============================================================
# 植物病害检测数据集配置文件 (YOLOv11 格式 - PlantDoc)
# Plant Disease Detection Dataset Configuration
# ============================================================
# 数据集来源: Kaggle PlantDoc Dataset
# https://www.kaggle.com/datasets/mrigaankbhatt/plantdoc-dataset
#
# 使用说明:
#   1. 将数据集图片放入 datasets/plant_disease/images/{train,val,test}/
#   2. 将对应标注文件放入 datasets/plant_disease/labels/{train,val,test}/
#   3. 标注格式: YOLO TXT (class_id cx cy w h)，坐标归一化到 [0, 1]
# ============================================================

# 数据集根目录 (相对于项目根目录)
path: ../datasets/plant_disease

# 子目录
train: images/train
val: images/val
test: images/test

# 类别数 (PlantDoc 数据集包含 28 个类别)
nc: 28

# 类别名称 (PlantDoc 数据集类别定义)
names:
  0: Apple_Scab_Leaf
  1: Apple_leaf
  2: Apple_rust_leaf
  3: Bell_pepper_leaf_spot
  4: Bell_pepper_leaf
  5: Blueberry_leaf
  6: Cherry_leaf
  7: Corn_Gray_leaf_spot
  8: Corn_leaf_blight
  9: Corn_rust_leaf
  10: Grape_leaf_black_rot
  11: Grape_leaf
  12: Grape_leaf_blight
  13: Peach_leaf
  14: Potato_leaf_early_blight
  15: Potato_leaf_late_blight
  16: Raspberry_leaf
  17: Soybean_leaf
  18: Squash_Powdery_mildew_leaf
  19: Strawberry_leaf
  20: Tomato_Early_blight_leaf
  21: Tomato_Septoria_leaf_spot
  22: Tomato_leaf
  23: Tomato_leaf_bacterial_spot
  24: Tomato_leaf_late_blight
  25: Tomato_leaf_mosaic_virus
  26: Tomato_leaf_yellow_virus
  27: Tomato_mold_leaf

