# ============================================================
# 训练策略：基线 (Baseline)
# 用途：作为论文对比实验的基准参照（对照组）
# ============================================================
# 使用标准训练参数，不加入额外增强或高级优化技巧。
# 论文中建议将此策略作为对照组 (Control Group)。
#
# 优化说明 (相比默认参数):
#   - batch=16: 适配多种 GPU 显存
#   - warmup_epochs=3: 基础预热，避免早期训练崩溃
#   - close_mosaic=10: 末期关闭 Mosaic 确保公平收敛
#   - amp=true: 加速训练
# ============================================================

# ---- 基本训练参数 ----
model: yolo11n.pt            # 轻量级预训练模型 (2.6M 参数)
epochs: 150                  # 训练轮数 (增加至 150 确保收敛)
batch: 16                    # 批次大小
imgsz: 640                   # 输入图片尺寸
patience: 25                 # 早停轮数

# ---- 优化器参数 ----
optimizer: SGD               # 随机梯度下降
lr0: 0.01                    # 初始学习率
lrf: 0.01                    # 最终学习率 = lr0 * lrf
momentum: 0.937              # SGD 动量
weight_decay: 0.0005         # 权重衰减

# 基础预热（防止早期训练不稳定）
warmup_epochs: 3.0           # 预热 3 轮
warmup_momentum: 0.8         # 预热起始动量
warmup_bias_lr: 0.1          # 预热偏置学习率

# ---- 训练加速 ----
amp: true                    # 混合精度训练

# ---- 数据增强参数（标准） ----
hsv_h: 0.015                 # HSV 色调
hsv_s: 0.7                   # HSV 饱和度
hsv_v: 0.4                   # HSV 亮度
degrees: 0.0                 # 不旋转
translate: 0.1               # 平移比例
scale: 0.5                   # 缩放比例
fliplr: 0.5                  # 水平翻转
flipud: 0.0                  # 不垂直翻转
mosaic: 1.0                  # 马赛克增强
close_mosaic: 10             # 最后 10 轮关闭 Mosaic
mixup: 0.0                   # 不使用 MixUp

# ---- 输出与保存 ----
project: runs/train
name: baseline
save_period: 10
plots: true
