# ============================================================
# 训练策略：基线 (Baseline)
# 用途：作为论文对比实验的基准参照
# ============================================================
# 使用标准训练参数，不加入额外增强或优化技巧。
# 论文中建议将此策略作为对照组 (Control Group)。
# ============================================================

# ---- 基本训练参数 ----
model: yolo11n.pt            # 轻量级预训练模型
epochs: 100                  # 训练轮数
batch: 32                    # 批次大小
imgsz: 640                   # 输入图片尺寸
patience: 20                 # 早停轮数

# ---- 优化器参数 ----
optimizer: SGD               # 随机梯度下降
lr0: 0.01                    # 初始学习率
lrf: 0.01                    # 最终学习率 = lr0 * lrf
momentum: 0.937              # SGD 动量
weight_decay: 0.0005         # 权重衰减

# ---- 数据增强参数（标准） ----
hsv_h: 0.015                 # HSV 色调
hsv_s: 0.7                   # HSV 饱和度
hsv_v: 0.4                   # HSV 亮度
degrees: 0.0                 # 不旋转
translate: 0.1               # 平移比例
scale: 0.5                   # 缩放比例
fliplr: 0.5                  # 水平翻转
flipud: 0.0                  # 不垂直翻转
mosaic: 1.0                  # 马赛克增强
mixup: 0.0                   # 不使用 MixUp

# ---- 输出与保存 ----
project: runs/train
name: baseline
save_period: 10
plots: true
