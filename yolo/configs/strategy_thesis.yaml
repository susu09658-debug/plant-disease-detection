# ============================================================
# 训练策略：论文优化 (Thesis Optimized)
# 用途：针对本科毕业论文优化，综合多种训练技巧提升模型性能
# ============================================================
# 本策略综合运用以下优化方法，适合在论文中展示最佳实验结果：
#
# 1. 使用 YOLOv11s 模型（精度与速度兼顾）
# 2. 采用 AdamW 优化器 + 余弦退火学习率调度
# 3. 渐进式数据增强：Mosaic + MixUp + CopyPaste
# 4. 更长的训练周期（200 epochs）和早停保护
# 5. 多尺度训练（imgsz=640）+ 较大 batch size
# 6. 标签平滑正则化（label_smoothing）减少过拟合
# 7. 学习率预热（warmup）策略提升训练稳定性
#
# 论文撰写建议：
#   - 与 baseline 策略对比，展示各项优化技术的提升效果
#   - 与 augment 策略对比，验证综合优化的优势
#   - 记录训练曲线，展示收敛过程和最终指标
#   - 分析各类别 AP，展示数据增强对小样本类别的改善
# ============================================================

# ---- 基本训练参数 ----
model: yolo11s.pt            # 使用 YOLOv11s 模型 (9.4M 参数，精度与速度兼顾)
epochs: 200                  # 更长训练周期，充分收敛
batch: 32                    # 批次大小
imgsz: 640                   # 标准输入尺寸
patience: 30                 # 早停轮数（防止过拟合）

# ---- 优化器参数（余弦退火 + 预热） ----
optimizer: AdamW             # AdamW 优化器（推荐用于目标检测任务）
lr0: 0.001                   # 初始学习率
lrf: 0.01                    # 余弦退火终止学习率比例（lr_final = lr0 * 0.01）
momentum: 0.937              # 动量系数
weight_decay: 0.01           # 权重衰减（AdamW 解耦权重衰减）
warmup_epochs: 5.0           # 学习率预热轮数
warmup_momentum: 0.5         # 预热起始动量（从 0.5 过渡到 momentum=0.937）
warmup_bias_lr: 0.01         # 预热期间偏置学习率

# ---- 数据增强参数（强化增强） ----
hsv_h: 0.02                  # HSV 色调增强（模拟不同光照）
hsv_s: 0.75                  # HSV 饱和度增强
hsv_v: 0.5                   # HSV 亮度增强
degrees: 10.0                # 随机旋转 ±10°（模拟拍摄角度变化）
translate: 0.15              # 随机平移比例
scale: 0.6                   # 随机缩放比例
fliplr: 0.5                  # 水平翻转概率
flipud: 0.1                  # 垂直翻转概率（叶片图像适用）
mosaic: 1.0                  # Mosaic 增强（四图拼接）
mixup: 0.15                  # MixUp 增强（图像混合）
copy_paste: 0.1              # CopyPaste 增强（实例复制粘贴）

# ---- 正则化 ----
label_smoothing: 0.1         # 标签平滑（减少模型对标签过度自信）

# ---- 输出与保存 ----
project: runs/train
name: thesis_optimized
save_period: 10
plots: true
