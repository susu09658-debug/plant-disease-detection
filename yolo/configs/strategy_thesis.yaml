# ============================================================
# 训练策略：论文深度优化 (Thesis Optimized v2)
# 用途：针对本科毕业论文，深度优化训练流程以获得最佳模型性能
# 训练环境: PyTorch 2.3, Python 3.12.3, CUDA 12.1, RTX 4090
# ============================================================
#
# 优化分析（针对 FieldPlant 数据集特点）:
#
#   FieldPlant 数据集为 Roboflow YOLO 格式，包含 27 类（木薯 5 类 + 玉米 16 类
#   + 番茄 6 类），已预划分 train/valid/test。相比 PlantDoc (~2500 张)，
#   FieldPlant 数据量更大、标注质量更高（Roboflow 标注），但类别不平衡
#   较为显著（玉米类别数远多于木薯和番茄）。
#
# 本策略综合以下核心优化:
#
#   1. 模型容量提升: YOLOv11s → YOLOv11m (20.1M 参数)
#      - 27 类细粒度分类需要更强的特征提取能力
#      - RTX 4090 24GB 显存完全足够支撑 medium 模型
#
#   2. 学习率精细调控: AdamW + 余弦退火 + 长预热
#      - lr0=0.001 (适配更大数据集，比小数据集略高)
#      - lrf=0.01 (低终止学习率，确保末期精细收敛)
#      - warmup_epochs=5 (充分预热消除早期震荡)
#      - cos_lr=true (显式启用余弦退火调度)
#
#   3. 标准分辨率训练: imgsz=640
#      - FieldPlant 图像多为田间实拍，640px 已能充分捕捉病害特征
#      - 相比 800px 显著降低显存和时间开销，性价比更高
#
#   4. 训练时长充分: 300 epochs
#      - 配合 patience=50 早停保护，避免无效训练
#
#   5. 关闭末期 Mosaic (close_mosaic=20)
#      - 训练最后 20 轮关闭 Mosaic 拼接增强
#      - 让模型在干净的单图上精细调整，显著提升最终精度
#
#   6. 渐进式数据增强: Mosaic + MixUp + CopyPaste + Erasing
#      - erasing=0.3: 随机擦除迫使模型学习局部特征
#      - copy_paste=0.15: 实例级复制粘贴，缓解类别不平衡
#      - mixup=0.15: 图像混合正则化
#
#   7. 梯度累积 (nbs=64)
#      - 名义 batch=64，实际 batch=16，自动累积 4 步
#      - 等效大 batch 训练，BN 统计更稳定
#
#   8. 混合精度训练 (amp=true)
#      - 充分利用 4090 的 FP16 Tensor Core 性能
#
#   9. 正则化策略组合
#      - label_smoothing=0.05 (轻度平滑，缓解类别不平衡)
#      - weight_decay=0.015 (适度权重衰减)
#
#   10. 损失函数权重调优
#       - box=7.5 (提升定位精度权重)
#       - cls=1.5 (略微提升分类权重，应对 27 类细粒度分类)
#       - dfl=1.5 (分布式焦点损失)
#
# 预期性能 (FieldPlant 数据集):
#   - mAP@0.5:      0.75+
#   - mAP@0.5:0.95: 0.50+
#   - Precision:     0.70+
#   - Recall:        0.65+
#   - 训练曲线平滑，指标稳定
#
# 论文撰写建议:
#   - 与 baseline 对比，逐项展示优化技术的提升效果（消融实验）
#   - 与 augment/finetune 策略对比，验证综合优化的优势
#   - 绘制训练曲线对比图，展示收敛速度和稳定性的改善
#   - 分析各类别 AP，展示优化对小样本 / 易混淆类别的改善
#   - 分析木薯/玉米/番茄三大类的检测差异
# ============================================================

# ---- 基本训练参数 ----
model: yolo11m.pt            # YOLOv11m (20.1M 参数，27 类细粒度分类需要更强特征提取)
epochs: 300                  # 充分训练 (配合 patience=50 早停保护)
batch: 16                    # 批次大小 (配合 imgsz=640 + yolo11m，4090 显存安全)
imgsz: 640                   # 标准分辨率 (FieldPlant 田间实拍图，640px 性价比最佳)
patience: 50                 # 早停轮数 (充足耐心，避免过早终止)

# ---- 优化器参数（余弦退火 + 预热） ----
optimizer: AdamW             # AdamW 优化器（解耦权重衰减，目标检测首选）
lr0: 0.001                   # 初始学习率 (适配较大数据集)
lrf: 0.01                    # 余弦退火终止比例 (lr_final = lr0 * lrf)
cos_lr: true                 # 显式启用余弦退火学习率调度
momentum: 0.937              # 动量系数
weight_decay: 0.015          # 适度权重衰减 (AdamW 解耦衰减)

# 学习率预热策略（消除早期训练不稳定）
warmup_epochs: 5.0           # 预热 5 epochs
warmup_momentum: 0.5         # 预热起始动量
warmup_bias_lr: 0.01         # 预热期间偏置学习率

# ---- 梯度累积与训练加速 ----
nbs: 64                      # 名义 batch size (实际 batch=16 时自动累积 4 步梯度)
amp: true                    # 混合精度训练 (FP16，充分利用 4090 Tensor Core)

# ---- 数据增强参数（强化 + 末期关闭策略） ----
hsv_h: 0.02                  # HSV 色调增强 (模拟不同光照条件)
hsv_s: 0.7                   # HSV 饱和度增强
hsv_v: 0.45                  # HSV 亮度增强
degrees: 10.0                # 随机旋转 ±10° (模拟田间拍摄角度变化)
translate: 0.15              # 随机平移比例
scale: 0.5                   # 随机缩放比例
shear: 2.0                   # 轻微剪切变换 (增加几何多样性)
fliplr: 0.5                  # 水平翻转概率
flipud: 0.1                  # 垂直翻转概率 (田间场景适度启用)
mosaic: 1.0                  # Mosaic 四图拼接 (增加小目标和多目标场景)
close_mosaic: 20             # 最后 20 轮关闭 Mosaic (关键优化: 让模型精细调整)
mixup: 0.15                  # MixUp 图像混合 (缓解类别不平衡)
copy_paste: 0.15             # CopyPaste 实例复制 (增加目标多样性)
erasing: 0.3                 # 随机擦除 (迫使模型学习多个局部特征)

# ---- 正则化 ----
label_smoothing: 0.05        # 轻度标签平滑 (减少过拟合，缓解类别不平衡)

# ---- 损失函数权重 ----
box: 7.5                     # 边框回归损失权重 (提升定位精度)
cls: 1.5                     # 分类损失权重 (略提升，应对 27 类细粒度分类)
dfl: 1.5                     # 分布式焦点损失权重

# ---- 输出与保存 ----
project: runs/train
name: thesis_optimized
save_period: 20              # 每 20 轮保存检查点
plots: true
