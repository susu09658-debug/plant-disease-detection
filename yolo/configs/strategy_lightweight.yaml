# ============================================================
# 训练策略：轻量化部署 (Lightweight Deployment)
# 用途：面向边缘设备或移动端的轻量级模型训练
# ============================================================
# 使用 YOLOv11n（最轻量）+ 较小输入分辨率 (416)，
# 适用于算力有限的部署环境（如树莓派、手机端推理）。
# 牺牲少量精度换取更快的推理速度和更小的模型体积。
# 论文中可用于讨论「精度 vs 效率」的权衡分析。
# ============================================================

# ---- 基本训练参数 ----
model: yolo11n.pt            # 超轻量模型 (2.6M 参数)
epochs: 150                  # 训练轮数 (增加以确保充分收敛)
batch: 32                    # 小图尺寸可使用更大批次
imgsz: 416                   # 降低输入分辨率
patience: 20                 # 早停

# ---- 优化器参数 ----
optimizer: Adam              # Adam 优化器（轻量化训练收敛更快）
lr0: 0.001                   # 初始学习率
lrf: 0.01                    # 最终学习率
momentum: 0.937              # 动量
weight_decay: 0.0005         # 权重衰减

# 基础预热
warmup_epochs: 3.0           # 预热 3 轮
warmup_momentum: 0.8         # 预热起始动量

# ---- 训练加速 ----
amp: true                    # 混合精度训练

# ---- 数据增强参数（简化） ----
hsv_h: 0.015                 # HSV 色调
hsv_s: 0.5                   # 降低饱和度增强
hsv_v: 0.3                   # 降低亮度增强
degrees: 0.0                 # 不旋转
translate: 0.1               # 平移比例
scale: 0.3                   # 降低缩放幅度
fliplr: 0.5                  # 水平翻转
flipud: 0.0                  # 不垂直翻转
mosaic: 0.5                  # 降低马赛克概率
close_mosaic: 10             # 最后 10 轮关闭 Mosaic
mixup: 0.0                   # 不使用 MixUp

# ---- 输出与保存 ----
project: runs/train
name: lightweight
save_period: 10
plots: true
