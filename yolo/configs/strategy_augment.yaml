# ============================================================
# 训练策略：数据增强 (Data Augmentation)
# 用途：验证数据增强对小样本类别检测精度的提升效果
# ============================================================
# 在基线策略基础上，启用更强的数据增强手段：
#   - 启用 MixUp + CopyPaste 增强
#   - 增加旋转、色彩抖动幅度
#   - 启用垂直翻转和随机擦除
#   - 关闭末期 Mosaic 确保收敛
# 论文中可对比本策略与基线策略在小样本类别上的 AP 差异。
# ============================================================

# ---- 基本训练参数 ----
model: yolo11n.pt            # 与基线保持一致 (控制变量)
epochs: 200                  # 增加轮数 (增强数据需要更多迭代)
batch: 16                    # 批次大小
imgsz: 640                   # 输入图片尺寸
patience: 30                 # 增强后需要更多轮才收敛

# ---- 优化器参数 ----
optimizer: SGD               # 随机梯度下降
lr0: 0.01                    # 初始学习率
lrf: 0.01                    # 最终学习率
momentum: 0.937              # SGD 动量
weight_decay: 0.0005         # 权重衰减

# 预热策略
warmup_epochs: 5.0           # 预热 5 轮
warmup_momentum: 0.5         # 预热起始动量
warmup_bias_lr: 0.1          # 预热偏置学习率

# ---- 训练加速 ----
amp: true                    # 混合精度训练

# ---- 数据增强参数（强化版） ----
hsv_h: 0.02                  # HSV 色调（加大）
hsv_s: 0.75                  # HSV 饱和度（加大）
hsv_v: 0.5                   # HSV 亮度（加大）
degrees: 15.0                # 旋转角度范围 ±15°
translate: 0.15              # 平移比例（加大）
scale: 0.6                   # 缩放比例（加大）
shear: 2.0                   # 轻微剪切变换
fliplr: 0.5                  # 水平翻转
flipud: 0.15                 # 启用垂直翻转
mosaic: 1.0                  # 马赛克增强
close_mosaic: 15             # 最后 15 轮关闭 Mosaic
mixup: 0.2                   # MixUp 增强
copy_paste: 0.1              # CopyPaste 增强
erasing: 0.2                 # 随机擦除 (迫使模型学习多个局部特征)

# ---- 输出与保存 ----
project: runs/train
name: augment
save_period: 10
plots: true
