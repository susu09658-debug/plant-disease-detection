# ============================================================
# 训练策略：数据增强 (Data Augmentation)
# 用途：验证数据增强对小样本类别检测精度的提升效果
# ============================================================
# 在基线策略基础上，启用更强的数据增强手段：
#   - 启用 MixUp 增强 (mixup=0.15)
#   - 增加旋转范围 (degrees=15.0)
#   - 增加色彩抖动幅度
#   - 启用垂直翻转 (flipud=0.1)
# 论文中可对比本策略与基线策略在小样本类别上的 AP 差异。
# ============================================================

# ---- 基本训练参数 ----
model: yolo11n.pt            # 与基线保持一致
epochs: 120                  # 适当增加轮数以收敛增强数据
batch: 16                    # 批次大小
imgsz: 640                   # 输入图片尺寸
patience: 25                 # 增强后可能需要更多轮才收敛

# ---- 优化器参数 ----
optimizer: SGD               # 随机梯度下降
lr0: 0.01                    # 初始学习率
lrf: 0.01                    # 最终学习率
momentum: 0.937              # SGD 动量
weight_decay: 0.0005         # 权重衰减

# ---- 数据增强参数（加强版） ----
hsv_h: 0.02                  # HSV 色调（加大）
hsv_s: 0.75                  # HSV 饱和度（加大）
hsv_v: 0.5                   # HSV 亮度（加大）
degrees: 15.0                # 旋转角度范围 ±15°
translate: 0.15              # 平移比例（加大）
scale: 0.6                   # 缩放比例（加大）
fliplr: 0.5                  # 水平翻转
flipud: 0.1                  # 启用轻度垂直翻转
mosaic: 1.0                  # 马赛克增强
mixup: 0.15                  # 启用 MixUp 增强

# ---- 输出与保存 ----
project: runs/train
name: augment
save_period: 10
plots: true
